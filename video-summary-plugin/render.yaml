services:
  - type: web
    name: video-summary-mcp
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUMMARY_MODEL
        value: gpt-5.6-luna
      - key: DATA_DIR
        value: data
      - key: OPENAI_API_KEY
        sync: false
      - key: BILIBILI_COOKIE
        sync: false
