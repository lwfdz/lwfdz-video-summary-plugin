interface:
  display_name: "视频总结"
  short_description: "从视频中提炼可核查知识并沉淀为个人知识卡片与复习材料"
  default_prompt: "Use $video-summary to summarize a video and save an evidence-labeled knowledge card."

dependencies:
  tools:
    - type: "mcp"
      value: "video-summary"
      description: "解析支持的视频链接、提取公开字幕并读写个人视频知识库。"
      transport: "streamable_http"
      url: "https://YOUR-RENDER-SERVICE.onrender.com/mcp"

policy:
  allow_implicit_invocation: true
