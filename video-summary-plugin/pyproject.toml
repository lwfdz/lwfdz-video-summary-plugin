[project]
name = "video-summary-mcp"
version = "0.1.0"
description = "Bilibili video summarization and personal knowledge library MCP server"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
